<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo Brew Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Neo Brew",
        "description": "Tetsu Kasuya's Neo Brew multi-pour drip recipe using a 1:15 coffee-to-water ratio.",
        "recipeCategory": "Coffee",
        "recipeCuisine": "Coffee",
        "recipeYield": "300g",
        "image": "/assets/images/goran-ivos-1JsjRW6Sbwg-unsplash.jpg",
        "recipeIngredient": [
          "Coffee beans 20g",
          "Water 300g"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Pour 30g at 0:00." },
          { "@type": "HowToStep", "text": "Pour 30g at 0:30." },
          { "@type": "HowToStep", "text": "Pour 30g every 15 seconds until 2:30." },
          { "@type": "HowToStep", "text": "Wait until drawdown completes around 3:30." },
          { "@type": "HowToStep", "text": "Finish." }
        ],
        "video": {
          "@type": "VideoObject",
          "name": "Neo Brew",
          "embedUrl": "https://www.youtube.com/embed/k0nsShguOsU"
        }
      }
    </script>
  </body>
</html>
