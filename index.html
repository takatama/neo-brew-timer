<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Neo Brew Timer</title>
    <meta name="description" content="A calm, voice-guided timer for Tetsu Kasuya's Neo Brew: ten pours at 1:15, with every scale target called out for you." />
    <meta name="theme-color" content="#f2eadf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15100c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <noscript>Neo Brew Timer needs JavaScript to keep time.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Neo Brew",
        "description": "Tetsu Kasuya's Neo Brew multi-pour drip recipe using a 1:15 coffee-to-water ratio.",
        "recipeCategory": "Coffee",
        "recipeCuisine": "Coffee",
        "recipeYield": "300g",
        "image": "/assets/images/goran-ivos-1JsjRW6Sbwg-unsplash.jpg",
        "recipeIngredient": [
          "Coffee beans 20g",
          "Water 300g"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Pour 30g at 0:00." },
          { "@type": "HowToStep", "text": "Pour 30g at 0:30." },
          { "@type": "HowToStep", "text": "Pour 30g every 15 seconds until 2:30." },
          { "@type": "HowToStep", "text": "Wait until drawdown completes around 3:30." },
          { "@type": "HowToStep", "text": "Finish." }
        ],
        "video": {
          "@type": "VideoObject",
          "name": "Neo Brew",
          "embedUrl": "https://www.youtube.com/embed/k0nsShguOsU"
        }
      }
    </script>
  </body>
</html>
